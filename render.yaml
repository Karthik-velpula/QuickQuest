services:
  - type: web
    name: tcs-aptitude-exam
    env: node
    plan: starter
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: ADMIN_USER
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: DATA_FILE
        value: /var/data/exams.json
    disk:
      name: exam-data
      mountPath: /var/data
      sizeGB: 1
